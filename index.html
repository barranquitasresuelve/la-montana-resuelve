<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Montaña Resuelve</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-[#1a2a4a] text-white p-4 sticky top-0 z-10">
<div class="max-w-5xl mx-auto flex justify-between items-center">
<div><h1 class="text-xl font-bold">La Montaña <span class="text-yellow-400">Resuelve</span></h1><p class="text-xs opacity-80">Directorio Verificado Barranquitas</p></div>
<span id="status" class="text-xs bg-white/20 px-3 py-1 rounded-full">Cargando...</span>
</div>
</header>
<div class="max-w-5xl mx-auto p-4">
<div class="bg-white rounded-2xl shadow-sm p-4 mb-4 flex flex-col gap-2">
<input id="search" placeholder="Buscar: ebanista, solar, lavadora..." class="w-full border rounded-xl p-3">
<div class="grid grid-cols-2 gap-2">
<select id="pueblo" class="border rounded-xl p-3"><option value="">Todos pueblos</option><option>Barranquitas</option><option>Comerio</option><option>Naranjito</option><option>Orocovis</option><option>Corozal</option><option>Aibonito</option></select>
<select id="cat" class="border rounded-xl p-3"><option value="">Todas categorías</option><option value="Ebanistería y Gabinetes">Ebanistería y Gabinetes</option><option value="Albañilería">Albañilería</option><option value="Construcción General">Construcción General</option><option value="Soldadura y Herrería">Soldadura y Herrería</option><option value="Plomería">Plomería</option><option value="Electricidad">Electricidad</option><option value="Energía Solar">Energía Solar</option><option value="Handyman / Mantenimiento">Handyman / Mantenimiento</option><option value="A/C y Refrigeración">A/C y Refrigeración</option><option value="Sellado de Techos">Sellado de Techos</option><option value="Jardinería y Landscaping">Jardinería y Landscaping</option><option value="Reparación Enseres Eléctricos">Reparación Enseres Eléctricos</option><option value="Reparación Lavadoras y Secadoras">Reparación Lavadoras y Secadoras</option><option value="Mecánica y Gomera">Mecánica y Gomera</option><option value="Limpieza Residencial">Limpieza Residencial</option><option value="Belleza, Barbería y Uñas">Belleza, Barbería y Uñas</option><option value="Mascotas y Grooming">Mascotas y Grooming</option><option value="Comida y Catering">Comida y Catering</option><option value="Tecnología y Celulares">Tecnología y Celulares</option><option value="Otros Servicios">Otros Servicios</option></select>
</div>
</div>
<div id="stats" class="text-sm text-gray-600 mb-3"></div>
<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>
<script>
const SHEET_ID="1HfQxwQUfR9k_4ngszBLvEAuKzJS4PuIaFnhVCQQhwSQ";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Form%20Responses%202`;
let data=[];
function normalize(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function cleanPhone(p){
  let d=(p||'').replace(/\D/g,'');
  if(d.length===10) d='1'+d;
  if(d.length===11 && d.startsWith('1')) return d;
  if(d.length>11) return d.slice(-11);
  return d;
}
function containsRoot(txt, q){
  if(!q) return true;
  if(txt.includes(q)) return true;
  if(q.includes('ebanist') && txt.includes('ebanist')) return true;
  if(q.includes('albanil') && txt.includes('albanil')) return true;
  if(q.includes('plomer') && txt.includes('plomer')) return true;
  if(q.includes('jardin') && txt.includes('jardin')) return true;
  if(q.includes('solar') && txt.includes('solar')) return true;
  if(q.includes('lavadora') && txt.includes('lavador')) return true;
  if(q.includes('enseres') && txt.includes('enseres')) return true;
  return false;
}
function render(){
const q=normalize(document.getElementById('search').value);
const pf=document.getElementById('pueblo').value;
const cf=document.getElementById('cat').value;
const cfNorm=normalize(cf);
let f=data.filter(d=>{
const txtNorm=normalize(d.nombre+" "+d.categoria+" "+d.pueblo+" "+d.descripcion+" "+d.dueno);
const catNorm=normalize(d.categoria+" "+d.descripcion);
const qMatch=!q||containsRoot(txtNorm,q);
const puebloMatch=!pf||normalize(d.pueblo).includes(normalize(pf));
let catMatch=true;
if(cf){
  catMatch = containsRoot(catNorm, cfNorm) || containsRoot(txtNorm, cfNorm);
  if(!catMatch){
    if(cfNorm.includes('ebanist') && txtNorm.includes('ebanist')) catMatch=true;
    if(cfNorm.includes('albanil') && (txtNorm.includes('albanil')||txtNorm.includes('bloque'))) catMatch=true;
    if(cfNorm.includes('solar') && txtNorm.includes('solar')) catMatch=true;
    if(cfNorm.includes('jardin') && txtNorm.includes('jardin')) catMatch=true;
    if(cfNorm.includes('soldadura') && txtNorm.includes('soldad')) catMatch=true;
    if(cfNorm.includes('lavadora') && txtNorm.includes('lavador')) catMatch=true;
    if(cfNorm.includes('enseres') && (txtNorm.includes('enseres')||txtNorm.includes('nevera')||txtNorm.includes('estufa'))) catMatch=true;
    if(cfNorm.includes('construccion') && (txtNorm.includes('construccion')||txtNorm.includes('madera')||txtNorm.includes('ebanist')||txtNorm.includes('gabinete'))) catMatch=true;
    if(cfNorm.includes('mascota') && txtNorm.includes('mascota')) catMatch=true;
    if(cfNorm.includes('grooming') && txtNorm.includes('grooming')) catMatch=true;
  }
}
return qMatch && puebloMatch && catMatch;
});
document.getElementById('stats').textContent=`${f.length} negocios verificados`;
const grid=document.getElementById('grid'); grid.innerHTML='';
f.forEach(b=>{
const card=document.createElement('div');
card.className="bg-white rounded-2xl shadow-sm overflow-hidden";
const hasFoto=b.foto && b.foto.startsWith('http');
const hasFb=b.facebook && b.facebook.startsWith('http');
const isIG=b.facebook && b.facebook.toLowerCase().includes('instagram');
const telClean=cleanPhone(b.telefono);
const waText=encodeURIComponent(`Hola ${b.nombre}, te encontré en La Montaña Resuelve y quisiera info de: ${b.categoria}`);
card.innerHTML=`${hasFoto?`<img src="${b.foto}" class="w-full h-40 object-cover" onerror="this.style.display='none'">`:''}<div class="p-4"><div class="flex gap-2 mb-2 flex-wrap"><span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full">${b.pueblo||''}</span><span class="text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded-full">${b.categoria||''}</span><span class="ml-auto text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full">Verificado</span></div><h3 class="font-bold">${b.nombre}</h3><p class="text-xs text-gray-500">${b.dueno||''}</p><p class="text-sm mt-1 text-gray-700">${b.descripcion||''}</p><div class="flex gap-2 mt-3"><a href="tel:+${telClean}" class="flex-1 text-center bg-[#1a2a4a] text-white text-sm py-2 rounded-xl">Llamar</a><a href="https://wa.me/${telClean}?text=${waText}" target="_blank" class="flex-1 text-center bg-green-500 text-white text-sm py-2 rounded-xl">WhatsApp</a>${hasFb?`<a href="${b.facebook}" target="_blank" class="px-3 ${isIG?'bg-gradient-to-br from-pink-500 to-yellow-500':'bg-blue-600'} text-white text-sm py-2 rounded-xl">${isIG?'IG':'f'}</a>`:''}</div></div>`;
grid.appendChild(card);
});
}
async function load(){
try{
const r=await fetch(SHEET_URL);
const t=await r.text();
const rows=[]; let cur=[]; let val=""; let inQ=false;
for(let i=0;i<t.length;i++){const c=t[i]; if(c=='"'){ if(inQ && t[i+1]=='"'){val+='"'; i++;} else {inQ=!inQ;} } else if(!inQ && c==','){cur.push(val.trim()); val="";} else if(!inQ && (c=='\n' || c=='\r')){ if(val||cur.length){cur.push(val.trim()); rows.push(cur); cur=[]; val="";} } else {val+=c;} }
if(val||cur.length){cur.push(val.trim()); rows.push(cur);}
const headers=rows[0].map(h=>normalize(h));
const find=(keys)=>headers.findIndex(h=>keys.some(k=>normalize(h).includes(normalize(k))));
const idx={ nombre: find(['nombre del nego','nombre']), dueno: find(['dueno','contacto']), pueblo: find(['pueblo','municipio']), categoria: find(['categoria']), descripcion: find(['descripcion','servicio','detalle']), telefono: find(['telefono','tel','cel']), foto: find(['foto','imagen','image','photo']), facebook: find(['facebook','instagram','fb','ig','social']) };
let list=rows.slice(1).map(r=>{ const get=(i)=> (i>=0 && r[i]?r[i].trim():''); return {nombre:get(idx.nombre)||r[0]||'', dueno:get(idx.dueno), pueblo:get(idx.pueblo), categoria:get(idx.categoria), descripcion:get(idx.descripcion), telefono:get(idx.telefono), foto:get(idx.foto), facebook:get(idx.facebook)}; });
list=list.filter(d=>{ if(!d.nombre) return false; const l=normalize(d.nombre); if(l.includes('nombre del negocio')) return false; return true; });
if(list.length>0){ data=list; document.getElementById('status').textContent='Conectado en vivo'; document.getElementById('status').className='text-xs bg-green-500 px-3 py-1 rounded-full'; } else throw 'vacio';
}catch(e){ document.getElementById('status').textContent='Modo demo - '+e; }
render();
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('pueblo').addEventListener('change',render);
document.getElementById('cat').addEventListener('change',render);
load();
</script>
</body>
</html>
