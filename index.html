<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Montaña Resuelve</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2a4a">
</head>
<body class="bg-gray-50">
<header class="bg-[#1a2a4a] text-white p-4 sticky top-0 z-10">
<div class="max-w-5xl mx-auto flex justify-between items-center">
<div><h1 class="text-xl font-bold">La Montaña <span class="text-yellow-400">Resuelve</span></h1><p class="text-xs opacity-80">Directorio Verificado Centro PR</p></div>
<span id="status" class="text-xs bg-white/20 px-3 py-1 rounded-full">Cargando...</span>
</div>
</header>
<div class="bg-yellow-400 text-[#1a2a4a] text-center py-2 text-sm font-bold sticky top-[64px] z-10">
<a href="https://docs.google.com/forms/d/14vyiDSWsfO1rnnh8MkUUkgCZbsQ0sYmFmXQzRgm3aAo/viewform" target="_blank" class="underline">¿Tienes negocio en Barranquitas, Comerío, Corozal, Naranjito? 📲 Regístralo GRATIS aquí →</a>
</div>

<div class="max-w-5xl mx-auto p-4">
<div class="bg-white rounded-2xl shadow-sm p-4 mb-4 flex flex-col gap-2">
<input id="search" placeholder="Buscar: enfermera, piscina, generador, cerrajero..." class="w-full border rounded-xl p-3">
<div class="grid grid-cols-2 gap-2">
<select id="pueblo" class="border rounded-xl p-3"><option value="">Todos pueblos</option><option>Barranquitas</option><option>Comerio</option><option>Naranjito</option><option>Orocovis</option><option>Corozal</option><option>Aibonito</option><option>Todo el Centro</option></select>
<select id="cat" class="border rounded-xl p-3"><option value="">Todas categorías</option><option value="Salud y Cuidado">Salud y Cuidado</option><option value="Ebanistería y Gabinetes">Ebanistería y Gabinetes</option><option value="Albañilería">Albañilería</option><option value="Construcción General">Construcción General</option><option value="Framing y Drywall">Framing y Drywall</option><option value="Excavación y Equipo Pesado">Excavación y Equipo Pesado</option><option value="Soldadura y Herrería">Soldadura y Herrería</option><option value="Plomería">Plomería</option><option value="Electricidad">Electricidad</option><option value="Energía Solar">Energía Solar</option><option value="Generadores">Generadores</option><option value="A/C y Refrigeración">A/C y Refrigeración</option><option value="Sellado de Techos">Sellado de Techos</option><option value="Cerrajería Hogar y Auto">Cerrajería Hogar y Auto</option><option value="Jardinería y Landscaping">Jardinería y Landscaping</option><option value="Control de Plagas">Control de Plagas</option><option value="Piscinas">Piscinas</option><option value="Reparación Enseres Eléctricos">Reparación Enseres Eléctricos</option><option value="Reparación Lavadoras y Secadoras">Reparación Lavadoras y Secadoras</option><option value="Mecánica y Gomera">Mecánica y Gomera</option><option value="Limpieza Residencial">Limpieza Residencial</option><option value="Belleza, Barbería y Uñas">Belleza, Barbería y Uñas</option><option value="Mascotas y Grooming">Mascotas y Grooming</option><option value="Comida y Catering">Comida y Catering</option><option value="Tecnología y Celulares">Tecnología y Celulares</option><option value="Otros Servicios">Otros Servicios</option></select>
</div>
</div>
<div id="stats" class="text-sm text-gray-600 mb-3"></div>
<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>
<script>
const SHEET_ID="1HfQxwQUfR9k_4ngszBLvEAuKzJS4PuIaFnhVCQQhwSQ";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Form%20Responses%202`;
let data=[];
function normalize(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function cleanPhone(p){
  if(!p) return '';
  let d=(''+p).replace(/\D/g,'');
  if(d.length===10) d='1'+d;
  return d;
}
function containsRoot(txt, q){
  if(!q) return true;
  if(txt.includes(q)) return true;
  const roots=['ebanist','albanil','plomer','jardin','solar','lavador','enseres','piscin','enferm','cuidador','cerraj','generador','excav','plaga','framing','drywall','mascota','grooming','construccion','gabinete'];
  for(let r of roots){ if(q.includes(r) && txt.includes(r)) return true; }
  return false;
}
function render(){
const q=normalize(document.getElementById('search').value);
const pf=document.getElementById('pueblo').value;
const cf=document.getElementById('cat').value;
const cfNorm=normalize(cf);
let f=data.filter(d=>{
const txtNorm=normalize(d.nombre+" "+d.categoria+" "+d.pueblo+" "+d.descripcion+" "+d.dueno);
const catNorm=normalize(d.categoria+" "+d.descripcion);
const qMatch=!q||containsRoot(txtNorm,q);
const puebloMatch=!pf|| pf==='Todo el Centro' || normalize(d.pueblo).includes(normalize(pf));
let catMatch=true;
if(cf){
  catMatch = containsRoot(catNorm, cfNorm) || containsRoot(txtNorm, cfNorm);
  if(!catMatch){
    if(cfNorm.includes('salud') && (txtNorm.includes('enferm')||txtNorm.includes('cuidador')||txtNorm.includes('terap')||txtNorm.includes('medico')||txtNorm.includes('salud'))) catMatch=true;
    if(cfNorm.includes('piscin') && txtNorm.includes('piscin')) catMatch=true;
    if(cfNorm.includes('cerraj') && txtNorm.includes('cerraj')) catMatch=true;
    if(cfNorm.includes('generador') && txtNorm.includes('generador')) catMatch=true;
    if(cfNorm.includes('excav') && (txtNorm.includes('excav')||txtNorm.includes('equipo pesado')||txtNorm.includes('tierra'))) catMatch=true;
    if(cfNorm.includes('plaga') && (txtNorm.includes('plaga')||txtNorm.includes('fumig'))) catMatch=true;
    if(cfNorm.includes('framing') && (txtNorm.includes('framing')||txtNorm.includes('drywall')||txtNorm.includes('gypsum'))) catMatch=true;
    if(cfNorm.includes('ebanist') && txtNorm.includes('ebanist')) catMatch=true;
    if(cfNorm.includes('albanil') && (txtNorm.includes('albanil')||txtNorm.includes('bloque'))) catMatch=true;
    if(cfNorm.includes('solar') && txtNorm.includes('solar')) catMatch=true;
    if(cfNorm.includes('jardin') && txtNorm.includes('jardin')) catMatch=true;
    if(cfNorm.includes('soldadura') && txtNorm.includes('soldad')) catMatch=true;
    if(cfNorm.includes('lavadora') && txtNorm.includes('lavador')) catMatch=true;
    if(cfNorm.includes('enseres') && (txtNorm.includes('enseres')||txtNorm.includes('nevera')||txtNorm.includes('estufa'))) catMatch=true;
    if(cfNorm.includes('construccion') && (txtNorm.includes('construccion')||txtNorm.includes('madera')||txtNorm.includes('ebanist')||txtNorm.includes('gabinete'))) catMatch=true;
  }
}
return qMatch && puebloMatch && catMatch;
});
document.getElementById('stats').textContent=`${f.length} negocios verificados en el Centro`;
const grid=document.getElementById('grid'); grid.innerHTML='';
f.forEach(b=>{
const hasFoto=b.foto && b.foto.startsWith('http');
const hasFb=b.facebook && b.facebook.length>3;
const telClean=cleanPhone(b.telefono);
const waClean=cleanPhone(b.whatsapp||b.telefono);
const waText=encodeURIComponent(`Hola ${b.nombre}, te vi en La Montaña Resuelve y quiero info de ${b.categoria} en ${b.pueblo}`);
const fbLink = b.facebook && b.facebook.startsWith('http')? b.facebook : (b.facebook? 'https://'+b.facebook : '');
const card=document.createElement('div');
card.className="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100";
card.innerHTML=`${hasFoto?`<img src="${b.foto}" class="w-full h-40 object-cover" onerror="this.style.display='none'">`:''}<div class="p-4"><div class="flex gap-2 mb-2 flex-wrap"><span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full">${b.pueblo||''}</span><span class="text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded-full">${b.categoria||''}</span><span class="ml-auto text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full">✓ Verificado</span></div><h3 class="font-bold text-[#1a2a4a]">${b.nombre}</h3><p class="text-xs text-gray-500">${b.dueno||''}</p><p class="text-xs text-gray-600 mt-1 font-mono">${b.telefono||''} ${b.whatsapp && b.whatsapp!==b.telefono? ' / WA: '+b.whatsapp : ''}</p><p class="text-sm mt-2 text-gray-700">${b.descripcion||''}</p><div class="flex gap-2 mt-4"><a href="tel:+${telClean}" class="flex-1 text-center bg-[#1a2a4a] text-white text-sm py-3 rounded-xl font-bold">📞 Llamar</a><a href="https://wa.me/${waClean}?text=${waText}" target="_blank" class="flex-1 text-center bg-[#25D366] text-white text-sm py-3 rounded-xl font-bold">WhatsApp</a>${hasFb && fbLink?`<a href="${fbLink}" target="_blank" class="px-4 bg-blue-600 text-white text-sm py-3 rounded-xl">f</a>`:''}</div></div>`;
grid.appendChild(card);
});
}

async function load(){
  const sheetsToTry = ["Form Responses 2", "Form Responses 1", "Hoja 1", "Form Responses 3", "Respuestas de formulario 1", "Sheet1"];
  let allRows = [];
  document.getElementById('status').textContent='Conectando...';
  for(let sheetName of sheetsToTry){
    try{
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
      const r=await fetch(url, {cache:'no-store'});
      if(!r.ok) continue;
      const t=await r.text();
      if(!t || t.toLowerCase().includes('<!doctype')) continue;
      const rows=[]; let cur=[]; let val=""; let inQ=false;
      for(let i=0;i<t.length;i++){const c=t[i]; if(c=='"'){ if(inQ && t[i+1]=='"'){val+='"'; i++;} else {inQ=!inQ;} } else if(!inQ && c==','){cur.push(val.trim()); val="";} else if(!inQ && (c=='
' || c=='')){ if(val||cur.length){cur.push(val.trim()); rows.push(cur); cur=[]; val="";} } else {val+=c;} }
      if(val||cur.length){cur.push(val.trim()); rows.push(cur);}
      if(rows.length>1) allRows = allRows.concat(rows.slice(1));
    }catch(e){ console.log("skip sheet", sheetName, e); }
  }
  try{
  // Deduplicate by nombre+telefono
  const map = new Map();
  let list = allRows.map(r=>{
    return {
      nombre:(r[1]||'').trim(),
      dueno:(r[2]||'').trim(),
      pueblo:(r[3]||'').trim(),
      categoria:(r[4]||'').trim(),
      descripcion:(r[5]||'').trim(),
      telefono:(r[6]||'').trim(),
      whatsapp:(r[7]||'').trim(),
      facebook:(r[8]||'').trim(),
      foto:(r[10]||r[9]||'').trim()
    };
  }).filter(d=>d.nombre && !normalize(d.nombre).includes('nombre del negocio'));
  
  list.forEach(d=>{
    const key = normalize(d.nombre+"-"+d.telefono);
    if(!map.has(key)) map.set(key, d);
  });
  data = Array.from(map.values());
  if(data.length>0){
    document.getElementById('status').textContent='Conectado en vivo ('+data.length+') - leyendo todas las pestañas';
    document.getElementById('status').className='text-xs bg-green-500 px-3 py-1 rounded-full text-white';
  } else {
    document.getElementById('status').textContent='0 negocios - revisa pestañas';
  }
  }catch(e){
    document.getElementById('status').textContent='Error: '+e;
  }
  render();
}

document.getElementById('search').addEventListener('input',render);
document.getElementById('pueblo').addEventListener('change',render);
document.getElementById('cat').addEventListener('change',render);
load();
</script>

<div class="max-w-5xl mx-auto p-4 text-center mt-8">
<a href="https://docs.google.com/forms/d/14vyiDSWsfO1rnnh8MkUUkgCZbsQ0sYmFmXQzRgm3aAo/viewform" target="_blank" class="inline-block bg-[#1a2a4a] text-white px-6 py-3 rounded-xl font-bold">➕ Registrar mi negocio GRATIS</a>
<p class="text-xs text-gray-500 mt-2">Hoja oficial conectada en vivo: 1HfQxw...hwSQ</p>
</div>
</body>
</html>
