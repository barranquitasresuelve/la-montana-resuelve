<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Montaña Resuelve</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2a4a">
</head>
<body class="bg-gray-50">
<header class="bg-[#1a2a4a] text-white p-4 sticky top-0 z-20">
<div class="max-w-5xl mx-auto flex justify-between items-center">
<div><h1 class="text-xl font-bold">La Montaña <span class="text-yellow-400">Resuelve</span></h1><p class="text-xs opacity-80">Directorio Verificado Centro PR</p></div>
<span id="status" class="text-xs bg-yellow-400 text-black px-3 py-1 rounded-full font-bold">Cargando...</span>
</div>
</header>
<div class="bg-yellow-400 text-[#1a2a4a] text-center py-2 text-sm font-bold sticky top-[64px] z-10">
<a href="https://docs.google.com/forms/d/14vyiDSWsfO1rnnh8MkUUkgCZbsQ0sYmFmXQzRgm3aAo/viewform" target="_blank" class="underline">¿Tienes negocio en Barranquitas, Comerío, Corozal, Naranjito? 📲 Regístralo GRATIS aquí →</a>
</div>
<div class="max-w-5xl mx-auto p-4">
<div class="bg-white rounded-2xl shadow-sm p-4 mb-4 flex flex-col gap-2">
<input id="search" placeholder="Buscar: enfermera, piscina, generador, cerrajero..." class="w-full border rounded-xl p-3">
<div class="grid grid-cols-2 gap-2">
<select id="pueblo" class="border rounded-xl p-3"><option value="">Todos pueblos</option><option>Barranquitas</option><option>Comerio</option><option>Naranjito</option><option>Orocovis</option><option>Corozal</option><option>Aibonito</option><option>Todo el Centro</option></select>
<select id="cat" class="border rounded-xl p-3"><option value="">Todas categorías</option><option value="Salud y Cuidado">Salud y Cuidado</option><option value="Ebanistería y Gabinetes">Ebanistería y Gabinetes</option><option value="Albañilería">Albañilería</option><option value="Construcción General">Construcción General</option><option value="Framing y Drywall">Framing y Drywall</option><option value="Excavación y Equipo Pesado">Excavación y Equipo Pesado</option><option value="Soldadura y Herrería">Soldadura y Herrería</option><option value="Plomería">Plomería</option><option value="Electricidad">Electricidad</option><option value="Energía Solar">Energía Solar</option><option value="Generadores">Generadores</option><option value="A/C y Refrigeración">A/C y Refrigeración</option><option value="Sellado de Techos">Sellado de Techos</option><option value="Cerrajería Hogar y Auto">Cerrajería Hogar y Auto</option><option value="Jardinería y Landscaping">Jardinería y Landscaping</option><option value="Control de Plagas">Control de Plagas</option><option value="Piscinas">Piscinas</option><option value="Reparación Enseres Eléctricos">Reparación Enseres Eléctricos</option><option value="Reparación Lavadoras y Secadoras">Reparación Lavadoras y Secadoras</option><option value="Mecánica y Gomera">Mecánica y Gomera</option><option value="Limpieza Residencial">Limpieza Residencial</option><option value="Belleza, Barbería y Uñas">Belleza, Barbería y Uñas</option><option value="Mascotas y Grooming">Mascotas y Grooming</option><option value="Comida y Catering">Comida y Catering</option><option value="Tecnología y Celulares">Tecnología y Celulares</option><option value="Otros Servicios">Otros Servicios</option></select>
</div>
</div>
<div id="stats" class="text-sm text-gray-600 mb-3"></div>
<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
<div id="debug" class="mt-8 p-3 bg-gray-100 rounded text-xs text-gray-500"></div>
</div>
<script>
const SHEET_ID="1HfQxwQUfR9k_4ngszBLvEAuKzJS4PuIaFnhVCQQhwSQ";
let data=[];

function normalize(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function cleanPhone(p){ if(!p) return ''; let d=(''+p).replace(/\D/g,''); if(d.length===10) d='1'+d; return d; }
function containsRoot(txt, q){ if(!q) return true; if(txt.includes(q)) return true; const roots=['ebanist','albanil','plomer','jardin','solar','lavador','enseres','piscin','enferm','cuidador','cerraj','generador','excav','plaga','framing','drywall','mascota','grooming','construccion','gabinete']; for(let r of roots){ if(q.includes(r) && txt.includes(r)) return true; } return false; }

function render(){
  const q=normalize(document.getElementById('search').value);
  const pf=document.getElementById('pueblo').value;
  const cf=document.getElementById('cat').value;
  const cfNorm=normalize(cf);
  let f=data.filter(d=>{
    const txtNorm=normalize(d.nombre+" "+d.categoria+" "+d.pueblo+" "+d.descripcion+" "+d.dueno);
    const catNorm=normalize(d.categoria+" "+d.descripcion);
    const qMatch=!q||containsRoot(txtNorm,q);
    const puebloMatch=!pf|| pf==='Todo el Centro' || normalize(d.pueblo).includes(normalize(pf));
    let catMatch=true;
    if(cf){ catMatch = containsRoot(catNorm, cfNorm) || containsRoot(txtNorm, cfNorm); }
    return qMatch && puebloMatch && catMatch;
  });
  document.getElementById('stats').textContent=`${f.length} negocios verificados en el Centro`;
  const grid=document.getElementById('grid'); grid.innerHTML='';
  f.forEach(b=>{
    const hasFoto=b.foto && b.foto.startsWith('http');
    const telClean=cleanPhone(b.telefono);
    const waClean=cleanPhone(b.whatsapp||b.telefono);
    const waText=encodeURIComponent(`Hola ${b.nombre}, te vi en La Montaña Resuelve y quiero info`);
    const fbLink = b.facebook && b.facebook.startsWith('http')? b.facebook : (b.facebook? 'https://'+b.facebook : '');
    const card=document.createElement('div');
    card.className="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100";
    card.innerHTML=`${hasFoto?`<img src="${b.foto}" class="w-full h-40 object-cover" onerror="this.style.display='none'">`:''}<div class="p-4"><div class="flex gap-2 mb-2 flex-wrap"><span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full">${b.pueblo||''}</span><span class="text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded-full">${b.categoria||''}</span><span class="ml-auto text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full">✓ Verificado</span></div><h3 class="font-bold text-[#1a2a4a]">${b.nombre}</h3><p class="text-xs text-gray-500">${b.dueno||''}</p><p class="text-xs text-gray-600 mt-1 font-mono">${b.telefono||''}</p><p class="text-sm mt-2 text-gray-700">${b.descripcion||''}</p><div class="flex gap-2 mt-4"><a href="tel:+${telClean}" class="flex-1 text-center bg-[#1a2a4a] text-white text-sm py-3 rounded-xl font-bold">📞 Llamar</a><a href="https://wa.me/${waClean}?text=${waText}" target="_blank" class="flex-1 text-center bg-[#25D366] text-white text-sm py-3 rounded-xl font-bold">WhatsApp</a></div></div>`;
    grid.appendChild(card);
  });
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  const rows = [];
  for(let line of lines){
    // simple split handling quoted commas
    const result = [];
    let cur = '', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c=='"'){
        if(inQ && line[i+1]=='"'){ cur+='"'; i++; } else { inQ=!inQ; }
      } else if(c==',' && !inQ){ result.push(cur.trim()); cur=''; }
      else { cur+=c; }
    }
    result.push(cur.trim());
    rows.push(result);
  }
  return rows;
}

async function load(){
  const debug = document.getElementById('debug');
  try{
    const sheetName = "Form Responses 2";
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
    debug.textContent = "Intentando cargar: "+sheetName+" ...";
    const r = await fetch(url);
    const t = await r.text();
    if(t.includes("<!DOCTYPE") || t.includes("<HTML>")){
      throw new Error("Hoja no pública - Google pide login. Pon la hoja en 'Cualquier persona con el vínculo'");
    }
    const rows = parseCSV(t);
    debug.textContent = "CSV filas: "+rows.length;
    let list = rows.slice(1).map(r=>({
      nombre:(r[1]||'').trim(),
      dueno:(r[2]||'').trim(),
      pueblo:(r[3]||'').trim(),
      categoria:(r[4]||'').trim(),
      descripcion:(r[5]||'').trim(),
      telefono:(r[6]||'').trim(),
      whatsapp:(r[7]||'').trim(),
      facebook:(r[8]||'').trim(),
      foto:(r[10]||r[9]||'').trim()
    })).filter(d=>d.nombre && !normalize(d.nombre).includes('nombre del negocio'));
    
    data = list;
    document.getElementById('status').textContent='Conectado en vivo ('+data.length+')';
    document.getElementById('status').className='text-xs bg-green-500 px-3 py-1 rounded-full text-white';
    debug.textContent += " | Negocios: "+data.length;
  }catch(e){
    document.getElementById('status').textContent='Error: '+e.message;
    document.getElementById('status').className='text-xs bg-red-500 text-white px-3 py-1 rounded-full';
    document.getElementById('debug').textContent = "ERROR: "+e.message+" - Asegúrate que la hoja OFICIAL esté en 'Cualquier persona con el vínculo puede ver'";
    // fallback demo data so page not black
    data = [];
  }
  render();
}

document.getElementById('search').addEventListener('input',render);
document.getElementById('pueblo').addEventListener('change',render);
document.getElementById('cat').addEventListener('change',render);
load();
</script>
<div class="max-w-5xl mx-auto p-4 text-center mt-8">
<a href="https://docs.google.com/forms/d/14vyiDSWsfO1rnnh8MkUUkgCZbsQ0sYmFmXQzRgm3aAo/viewform" target="_blank" class="inline-block bg-[#1a2a4a] text-white px-6 py-3 rounded-xl font-bold">➕ Registrar mi negocio GRATIS</a>
<p class="text-xs text-gray-500 mt-2">V17 - Hoja oficial: 1HfQxw...hwSQ - Form Responses 2</p>
</div>
</body>
</html>
