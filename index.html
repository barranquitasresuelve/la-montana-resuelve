 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Montaña Resuelve</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-[#1a2a4a] text-white p-4 sticky top-0 z-10">
<div class="max-w-5xl mx-auto flex justify-between items-center">
<div>
<h1 class="text-xl font-bold">La Montaña <span class="text-yellow-400">Resuelve</span></h1>
<p class="text-xs opacity-80">Directorio Verificado Barranquitas</p>
</div>
<span id="status" class="text-xs bg-white/20 px-3 py-1 rounded-full">Cargando...</span>
</div>
</header>
<div class="max-w-5xl mx-auto p-4">
<div class="bg-white rounded-2xl shadow-sm p-4 mb-4 flex flex-col md:flex-row gap-2">
<input id="search" placeholder="Buscar: plomero, electricidad..." class="flex-1 border rounded-xl p-3">
<div class="grid grid-cols-2 gap-2">
<select id="pueblo" class="border rounded-xl p-3"><option value="">Todos pueblos</option><option>Barranquitas</option><option>Comerio</option><option>Naranjito</option><option>Orocovis</option><option>Corozal</option><option>Aibonito</option></select>
<select id="cat" class="border rounded-xl p-3"><option value="">Todas categorias</option><option>Plomería</option><option>Electricidad</option><option>Construcción</option><option>Limpieza</option><option>Belleza</option><option>Otros</option></select>
</div>
</div>
<div id="stats" class="text-sm text-gray-600 mb-3"></div>
<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>
<script>
const SHEET_ID="1HfQxwQUfR9k_4ngszBLvEAuKzJS4PuIaFnhVCQQhwSQ";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Form%20Responses%202`;
const demo=[
{nombre:"Artisan's Cabinets",dueno:"Heriberto Garrido",pueblo:"Barranquitas",categoria:"Construcción",telefono:"7871234567",descripcion:"Gabinetes a la medida"},
{nombre:"JR Handyman Services",dueno:"Juan Vasquez",pueblo:"Barranquitas",categoria:"Otros",telefono:"7872345678",descripcion:"Handyman general"},
{nombre:"Bubbles of Joy Dog Grooming",dueno:"Sullivan",pueblo:"Barranquitas",categoria:"Otros",telefono:"7873456789",descripcion:"Grooming de perros"}
];
const _demo_old=[
{nombre:"Artisan's Cabinets",dueno:"Heriberto Garrido",pueblo:"Barranquitas",categoria:"Construcción",telefono:"7871234567"},
{nombre:"JR Handyman Services",dueno:"Juan Vasquez",pueblo:"Barranquitas",categoria:"Otros",telefono:"7872345678"},
{nombre:"Bubbles of Joy Dog Grooming",dueno:"Sullivan",pueblo:"Barranquitas",categoria:"Otros",telefono:"7873456789"}
];
let data=[];
function render(){
const q=document.getElementById('search').value.toLowerCase();
const pf=document.getElementById('pueblo').value;
const cf=document.getElementById('cat').value;
let f=data.filter(d=>{
const txt=(d.nombre+" "+d.categoria+" "+d.pueblo+" "+d.descripcion).toLowerCase();
return (!q||txt.includes(q)) && (!pf||d.pueblo.includes(pf)) && (!cf||d.categoria.includes(cf));
});
document.getElementById('stats').textContent=`${f.length} negocios verificados`;
const grid=document.getElementById('grid'); grid.innerHTML='';
f.forEach(b=>{
const card=document.createElement('div');
card.className="bg-white rounded-2xl shadow-sm overflow-hidden";
const hasFoto=b.foto && b.foto.startsWith('http');
const hasFb=b.facebook && b.facebook.startsWith('http');
const isIG=b.facebook && b.facebook.toLowerCase().includes('instagram');
card.innerHTML=`
${hasFoto?`<img src="${b.foto}" class="w-full h-40 object-cover" onerror="this.style.display='none'">`:''}
<div class="p-4">
<div class="flex gap-2 mb-2">
<span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full">${b.pueblo||''}</span>
<span class="text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded-full">${b.categoria||''}</span>
<span class="ml-auto text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full">Verificado</span>
</div>
<h3 class="font-bold">${b.nombre}</h3>
<p class="text-xs text-gray-500">${b.dueno||''}</p>
<p class="text-sm mt-1 text-gray-700">${b.descripcion||''}</p>
<div class="flex gap-2 mt-3">
<a href="tel:${b.telefono}" class="flex-1 text-center bg-[#1a2a4a] text-white text-sm py-2 rounded-xl">Llamar</a>
<a href="https://wa.me/1${(b.telefono||'').replace(/\D/g,'')}" target="_blank" class="flex-1 text-center bg-green-500 text-white text-sm py-2 rounded-xl">WhatsApp</a>
${hasFb?`<a href="${b.facebook}" target="_blank" class="px-3 ${isIG?'bg-gradient-to-br from-pink-500 to-yellow-500':'bg-blue-600'} text-white text-sm py-2 rounded-xl">${isIG?'IG':'f'}</a>`:''}
</div>
</div>`;
grid.appendChild(card);
});
}
async function load(){
try{
const r=await fetch(SHEET_URL);
const t=await r.text();
const rows=[]; let cur=[]; let val=""; let inQ=false;
for(let i=0;i<t.length;i++){
const c=t[i];
if(c=='"'){ if(inQ && t[i+1]=='"'){val+='"'; i++;} else {inQ=!inQ;} }
else if(!inQ && c==','){cur.push(val.trim()); val="";}
else if(!inQ && (c=='\n' || c=='\r')){ if(val||cur.length){cur.push(val.trim()); rows.push(cur); cur=[]; val="";} }
else {val+=c;}
}
if(val||cur.length){cur.push(val.trim()); rows.push(cur);}
const headers=rows[0].map(h=>h.toLowerCase());
const find=(keys)=>headers.findIndex(h=>keys.some(k=>h.includes(k)));
const idx={
nombre: find(['nombre del nego','nombre']),
dueno: find(['dueno','contacto','nombre del dueno']),
pueblo: find(['pueblo','municipio']),
categoria: find(['categoria']),
descripcion: find(['descripcion','servicio','detalle']),
telefono: find(['telefono','tel','cel']),
foto: find(['foto','imagen','image','photo']),
facebook: find(['facebook','instagram','fb','ig','social','link'])
};
let list=rows.slice(1).map(r=>{
const get=(i)=> (i>=0 && r[i]?r[i].trim():'');
return {nombre:get(idx.nombre)||r[0]||'', dueno:get(idx.dueno), pueblo:get(idx.pueblo), categoria:get(idx.categoria), descripcion:get(idx.descripcion), telefono:get(idx.telefono), foto:get(idx.foto), facebook:get(idx.facebook)};
});
list=list.filter(d=>{
if(!d.nombre) return false;
const l=d.nombre.toLowerCase();
if(l.includes('nombre del negocio')) return false;
if(l.includes('nombre del due')) return false;
return true;
});
if(list.length>0){ data=list; document.getElementById('status').textContent='Conectado en vivo'; document.getElementById('status').className='text-xs bg-green-500 px-3 py-1 rounded-full'; }
else throw 'vacio';
}catch(e){ data=demo; document.getElementById('status').textContent='Modo demo'; }
render();
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('pueblo').addEventListener('change',render);
document.getElementById('cat').addEventListener('change',render);
load();
</script>
</body>
</html>
